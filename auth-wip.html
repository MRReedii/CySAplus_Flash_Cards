<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline-First App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg,#08111f,#1a1147,#0d6efd);
      background-size: 300% 300%;
      animation: bg 12s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    @keyframes bg {
      0%, 100% { background-position: 0 50%; }
      50% { background-position: 100% 50%; }
    }
    .bg span {
      position: absolute;
      border-radius: 50%;
      background: #ffffff12;
      animation: f 18s linear infinite;
      z-index: 0;
    }
    .bg span:nth-child(1) { width: 220px; height: 220px; left: 8%; top: 15%; }
    .bg span:nth-child(2) { width: 120px; height: 120px; right: 10%; top: 20%; }
    .bg span:nth-child(3) { width: 180px; height: 180px; left: 60%; bottom: 5%; }
    @keyframes f {
      50% { transform: translateY(-30px); }
    }

    .app { width: 100%; max-width: 480px; padding: 24px; position: relative; z-index: 1; }

    /* Feature Flag Visibility Rule */
    .feature-in-dev { display: none !important; }

    /* Developer Header Panel */
    .dev-header {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed #00d4ff;
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(14px);
    }
    .dev-header.visible { display: flex; }
    .dev-header-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #00d4ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dev-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .dev-control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dev-control-group label {
      font-size: 0.72rem;
      opacity: 0.85;
      font-weight: 500;
    }
    .dev-select {
      background: #ffffff18;
      color: #fff;
      border: 1px solid #ffffff30;
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }
    .dev-select option {
      background: #08111f;
      color: #fff;
    }

    /* Cards */
    .card {
      background: #ffffff18;
      border: 1px solid #ffffff30;
      border-radius: 24px;
      padding: 36px;
      margin-bottom: 16px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px #0006;
      transition: .35s;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; color: #fff; user-select: none; }
    h1.clickable { cursor: pointer; }
    h1.clickable:active { transform: scale(0.98); }
    h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 20px; color: #ddd; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 5px 12px;
      border-radius: 999px;
      margin-left: 8px;
      font-weight: 600;
      vertical-align: middle;
      backdrop-filter: blur(12px);
    }
    .badge-online { background: #1a3a1a99; color: #4caf50; border: 1px solid #4caf5055; }
    .badge-offline { background: #3a1a1a99; color: #f44336; border: 1px solid #f4433655; }

    /* Inputs */
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #ffffff30;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.4); }
    input:focus { border-color: #00d4ff; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      background: linear-gradient(135deg, #00d4ff, #6d5dfc);
      color: #fff;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px #0005; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-primary { background: linear-gradient(135deg, #00d4ff, #6d5dfc); color: #fff; }
    .btn-guest { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
    .btn-google { background: #fff; color: #333; }
    .btn-apple { background: #000; color: #fff; border: 1px solid #444; }
    .btn-ms { background: #2f2f2f; color: #fff; }
    .btn-github { background: #24292e; color: #fff; }
    .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; }
    .btn-outline { background: transparent; color: #fff; border: 1px solid #ffffff40; }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }

    .divider {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      margin: 8px 0 16px;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    /* Data display */
    .data-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .data-row input { margin-bottom: 0; }
    .data-row .btn { width: auto; padding: 12px 18px; margin-bottom: 0; white-space: nowrap; }
    #json-display {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #ffffff20;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.82rem;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow-y: auto;
      color: #00ffd0;
      margin-bottom: 16px;
    }
    .user-info { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 16px; word-break: break-all; }
    .user-info span { color: #fff; font-weight: 500; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(20, 20, 30, 0.9);
      border: 1px solid #ffffff30;
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 10px 30px #0008;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<div class="app">

  <!-- Status Bar -->
  <div style="text-align:right; margin-bottom:12px;">
    <span id="status-badge" class="badge badge-online">● Online</span>
  </div>

  <!-- HIDDEN DEVELOPER HEADER CONTROLS -->
  <div class="dev-header" id="devHeader">
    <div class="dev-header-title">
      <span>🛠 Feature Flag Controls</span>
      <span style="font-size: 0.65rem; opacity: 0.6; font-weight: normal; text-transform: none;">Click title 5x to hide</span>
    </div>
    <div class="dev-controls-grid">
      <div class="dev-control-group">
        <label for="flagShowAll">SHOW_ALL_DEV_FEATURES</label>
        <select id="flagShowAll" class="dev-select" onchange="updateFeatureFlag('SHOW_ALL_DEV_FEATURES', this.value)">
          <option value="false">Disabled (false)</option>
          <option value="true">Enabled (true)</option>
        </select>
      </div>
      <div class="dev-control-group">
        <label for="flagApple">ENABLE_APPLE_AUTH</label>
        <select id="flagApple" class="dev-select" onchange="updateFeatureFlag('ENABLE_APPLE_AUTH', this.value)">
          <option value="false">Disabled (false)</option>
          <option value="true">Enabled (true)</option>
        </select>
      </div>
      <div class="dev-control-group">
        <label for="flagMS">ENABLE_MS_AUTH</label>
        <select id="flagMS" class="dev-select" onchange="updateFeatureFlag('ENABLE_MS_AUTH', this.value)">
          <option value="false">Disabled (false)</option>
          <option value="true">Enabled (true)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Auth Card -->
  <div id="auth-card" class="card">
    <h1 class="clickable" onclick="handleTitleClick()">Welcome</h1>
    <h2>Sign in to continue</h2>

    <!-- Continue as Guest Option placed first -->
    <button id="btn-guest" class="btn btn-guest">👤 &nbsp;Continue as Guest</button>
    
    <div class="divider">or sign in with email</div>

    <input id="email" type="email" placeholder="Email address" />
    <input id="password" type="password" placeholder="Password" />
    <button id="btn-signin" class="btn btn-primary">Sign In with Email</button>
    <button id="btn-signup" class="btn btn-outline">Create Account</button>

    <div class="divider">or continue with provider</div>

    <button class="btn btn-google" data-provider="google">🔵 &nbsp;Continue with Google</button>
    <button class="btn btn-apple feature-in-dev feature-apple" data-provider="apple">🍎 &nbsp;Continue with Apple</button>
    <button class="btn btn-ms feature-in-dev feature-ms" data-provider="azure">🪟 &nbsp;Continue with Microsoft</button>
    <button class="btn btn-github" data-provider="github">🐙 &nbsp;Continue with GitHub</button>
  </div>

  <!-- Protected Data Card -->
  <div id="data-card" class="card hidden">
    <h1>Protected Data</h1>
    <div class="user-info">Signed in as <span id="user-display"></span></div>

    <div class="data-row">
      <input id="data-key" placeholder="Key" style="flex:1" />
      <input id="data-value" placeholder="Value" style="flex:2" />
      <button id="btn-save" class="btn btn-primary">Save</button>
    </div>

    <div id="json-display">{}</div>

    <button id="btn-clear" class="btn btn-outline" style="margin-bottom: 12px; width: 100%;">Clear All Data</button>
    <button id="btn-signout" class="btn btn-danger">Sign Out</button>
  </div>

</div>

<div id="toast"></div>

<script>
  // FEATURE FLAGS CONFIGURATION
  const FEATURE_FLAGS = {
    SHOW_ALL_DEV_FEATURES: false,
    ENABLE_APPLE_AUTH: false,
    ENABLE_MS_AUTH: false
  };

  // Re-evaluates CSS classes based on active feature flags
  function applyFeatureFlags() {
    document.querySelectorAll('.feature-apple, .feature-ms').forEach(el => {
      el.classList.add('feature-in-dev');
    });

    if (FEATURE_FLAGS.SHOW_ALL_DEV_FEATURES) {
      document.querySelectorAll('.feature-apple, .feature-ms').forEach(el => el.classList.remove('feature-in-dev'));
    } else {
      if (FEATURE_FLAGS.ENABLE_APPLE_AUTH) {
        document.querySelectorAll('.feature-apple').forEach(el => el.classList.remove('feature-in-dev'));
      }
      if (FEATURE_FLAGS.ENABLE_MS_AUTH) {
        document.querySelectorAll('.feature-ms').forEach(el => el.classList.remove('feature-in-dev'));
      }
    }
  }

  // Sync developer panel dropdown selectors with active state
  function syncDevControlSelects() {
    if (document.getElementById('flagShowAll')) document.getElementById('flagShowAll').value = String(FEATURE_FLAGS.SHOW_ALL_DEV_FEATURES);
    if (document.getElementById('flagApple')) document.getElementById('flagApple').value = String(FEATURE_FLAGS.ENABLE_APPLE_AUTH);
    if (document.getElementById('flagMS')) document.getElementById('flagMS').value = String(FEATURE_FLAGS.ENABLE_MS_AUTH);
  }

  // Update specific feature flag from dropdown input
  function updateFeatureFlag(flagName, valueStr) {
    FEATURE_FLAGS[flagName] = valueStr === 'true';
    applyFeatureFlags();
    syncDevControlSelects();
  }

  // SECRET 5-CLICK TITLE TRAP
  let titleClickCount = 0;
  let titleClickTimer = null;

  function handleTitleClick() {
    titleClickCount++;
    
    clearTimeout(titleClickTimer);
    titleClickTimer = setTimeout(() => {
      titleClickCount = 0;
    }, 1500);

    if (titleClickCount >= 5) {
      titleClickCount = 0;
      const devHeader = document.getElementById('devHeader');
      devHeader.classList.toggle('visible');
    }
  }

  // Supabase Config
  const SUPABASE_URL = 'https://xwnlaiqkmtmlgzbzxmkx.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_KaWOp4v3PhGVJhQIf1wSnw_g4x2IMwN';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let currentUser = null;

  // Local Storage Utilities
  function getStorageKey() {
    return (currentUser && currentUser.id !== 'guest') ? `app_data_${currentUser.id}` : 'app_data_guest';
  }

  function loadStore() {
    try {
      return JSON.parse(localStorage.getItem(getStorageKey()) || '{}');
    } catch {
      return {};
    }
  }

  function saveStore(data) {
    localStorage.setItem(getStorageKey(), JSON.stringify(data, null, 2));
    renderStore();
    syncToRemote();
  }

  function renderStore() {
    document.getElementById('json-display').textContent = JSON.stringify(loadStore(), null, 2);
  }

  function saveEntry() {
    const key = document.getElementById('data-key').value.trim();
    const value = document.getElementById('data-value').value.trim();
    if (!key) { toast('Enter a key'); return; }
    
    const store = loadStore();
    store[key] = value;
    saveStore(store);
    
    document.getElementById('data-key').value = '';
    document.getElementById('data-value').value = '';
    toast('Saved locally ✓');
  }

  function clearStore() {
    saveStore({});
    toast('Store cleared');
  }

  // Remote Syncing
  async function syncToRemote() {
    if (!navigator.onLine || !currentUser || currentUser.id === 'guest') return;
    const store = loadStore();
    const { error } = await sb
      .from('user_data')
      .upsert({ user_id: currentUser.id, payload: store, updated_at: new Date() });

    if (!error) toast('Synced with cloud ✓');
  }

  // Navigation / UI
  function showApp(user) {
    currentUser = user;
    document.getElementById('auth-card').classList.add('hidden');
    document.getElementById('data-card').classList.remove('hidden');
    document.getElementById('user-display').textContent = user.email || user.id;
    renderStore();
    syncToRemote();
  }

  function showAuth() {
    currentUser = null;
    document.getElementById('data-card').classList.add('hidden');
    document.getElementById('auth-card').classList.remove('hidden');
  }

  // Authentication Handlers
  function continueAsGuest() {
    showApp({ id: 'guest', email: 'Guest User' });
    toast('Continuing as guest');
  }

  async function emailSignIn() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { toast(error.message); return; }
    toast('Welcome back!');
    showApp(data.user);
  }

  async function emailSignUp() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) { toast(error.message); return; }
    toast('Account created!');
    if (data.user) showApp(data.user);
  }

  async function oauthLogin(provider) {
    const { error } = await sb.auth.signInWithOAuth({
      provider,
      options: { redirectTo: window.location.href }
    });
    if (error) toast(error.message);
  }

  async function signOut() {
    if (currentUser && currentUser.id !== 'guest') {
      await sb.auth.signOut();
    }
    showAuth();
    toast('Signed out');
  }

  // Event Listeners
  document.getElementById('btn-guest').addEventListener('click', continueAsGuest);
  document.getElementById('btn-signin').addEventListener('click', emailSignIn);
  document.getElementById('btn-signup').addEventListener('click', emailSignUp);
  document.getElementById('btn-save').addEventListener('click', saveEntry);
  document.getElementById('btn-clear').addEventListener('click', clearStore);
  document.getElementById('btn-signout').addEventListener('click', signOut);

  document.querySelectorAll('[data-provider]').forEach(button => {
    button.addEventListener('click', () => oauthLogin(button.dataset.provider));
  });

  // Network State and Auth Listener
  function updateNetworkBadge() {
    const badge = document.getElementById('status-badge');
    if (navigator.onLine) {
      badge.textContent = '● Online';
      badge.className = 'badge badge-online';
      syncToRemote();
    } else {
      badge.textContent = '● Offline';
      badge.className = 'badge badge-offline';
    }
  }

  window.addEventListener('online', updateNetworkBadge);
  window.addEventListener('offline', updateNetworkBadge);

  sb.auth.onAuthStateChange((_event, session) => {
    if (session?.user) {
      showApp(session.user);
    } else if (!currentUser || currentUser.id !== 'guest') {
      showAuth();
    }
  });

  // Toast Helper
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // Initialize flags on load
  applyFeatureFlags();
  syncDevControlSelects();
  updateNetworkBadge();
</script>
</body>
</html>
